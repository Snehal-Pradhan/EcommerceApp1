events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sendfile is on by default; leave it. Keep the client body limit aligned
    # with the API's max_upload_bytes (5 MiB) plus multipart overhead, so a
    # large upload is rejected by the API with a real 413 rather than by nginx
    # with a bare 502.
    client_max_body_size 6m;

    # Docker's embedded DNS server. nginx resolves `upstream` names once at
    # startup and caches the answer for the lifetime of the process, so if the
    # api container is recreated with a new IP the proxy would keep dialling the
    # old one and 502 until it was restarted. Declaring a resolver and referring
    # to backends through variables makes nginx re-resolve per request (honouring
    # `valid`), which is self-healing.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ------------------------------------------------------------ storefront --
    server {
        listen 80;
        server_name _;

        set $api     http://api:8000;
        set $frontend http://frontend:8080;

        # The API's own probes, forwarded so a load balancer or the post-deploy
        # smoke test can reach them through the front door. /health and /ready
        # never touch the web containers - a probe that depends on a dependency
        # restarts healthy containers during an outage.
        location = /health {
            proxy_pass $api/health;
        }

        location = /ready {
            proxy_pass $api/ready;
        }

        # Everything else under /api is the API. $request_uri carries the full
        # path *and* the query string, and because a proxy_pass built from a
        # variable does no automatic prefix substitution, the URI arrives at the
        # API exactly as the browser sent it.
        location /api/ {
            proxy_pass $api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # The storefront. The container listens on 8080, not 3000: the hardened
        # Chainguard nginx runs as uid 65532, which cannot bind a port below
        # 1024 but also does not get 3000 handed to it - 8080 is the only listen
        # in its baked config.
        location / {
            proxy_pass $frontend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ----------------------------------------------------------------- admin --
    # Separate port, not an /admin/ path prefix. admin/src/main.jsx uses
    # BrowserRouter with no basename, so under a prefix every client-side route
    # would miss and a deep link like /admin/orders would 404. Its own origin
    # keeps the router at path root.
    server {
        listen 8081;
        server_name _;

        set $api   http://api:8000;
        set $admin http://admin:8080;

        # The admin SPA is served from this origin, so its own relative /api
        # calls need the same treatment as the storefront's.
        location /api/ {
            proxy_pass $api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /health {
            proxy_pass $api/health;
        }

        location / {
            proxy_pass $admin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
