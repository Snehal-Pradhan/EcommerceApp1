# Phase 1 — CI: checks plus image publishing, one job per app.
#
# Jobs:
#   web     - a frontend/admin matrix: eslint + vitest, then docker build+push
#   backend - ruff + pytest, then docker build+push
#
# Each app's image is built in the same job that checked it, so a lint or test
# failure never reaches the registry.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # Let every app report its own result instead of cancelling siblings.
      fail-fast: false
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        id: lint
        run: |
          if npm run lint --silent; then
            echo "Primary linter passed: eslint"
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "eslint failed, trying fallback linter"
            if npx --yes eslint@9 .; then
              echo "Fallback linter passed"
              echo "result=pass-fallback" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Both eslint and fallback linter failed"
              echo "result=fail" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fail if linting failed
        if: steps.lint.outputs.result == 'fail'
        run: exit 1

      - name: Test (vitest)
        run: npm run test --silent

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        id: lint
        run: |
          if ruff check .; then
            echo "Primary linter passed: ruff"
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "ruff failed, trying fallback linter"
            if pip install --quiet flake8 && flake8 --max-line-length=100 --extend-ignore=E203,W503 .; then
              echo "Fallback linter passed"
              echo "result=pass-fallback" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Both ruff and flake8 failed"
              echo "result=fail" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fail if linting failed
        if: steps.lint.outputs.result == 'fail'
        run: exit 1

      - name: Test (pytest)
        run: pytest

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/backend:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/backend:latest
