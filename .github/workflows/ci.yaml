name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight; cancel it
# instead of paying for both. Runs on different branches never collide.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # matrix.app is the lowercase folder name used in paths; matrix.label is
    # only for display. Directory names are case-sensitive on the runner.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    # A hung step otherwise burns minutes for 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frontend
            label: Frontend
          - app: admin
            label: Admin
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        id: lint
        run: |
          if npm run lint --silent; then
            echo "Primary linter passed: eslint"
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "eslint failed, trying fallback linter"
            if npx --yes eslint@9 .; then
              echo "Fallback linter passed"
              echo "result=pass-fallback" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Both eslint and fallback linter failed"
              echo "result=fail" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fail if linting failed
        if: steps.lint.outputs.result == 'fail'
        run: exit 1

      - name: Test (vitest)
        run: npm run test --silent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # type=gha cache export is unsupported on the default docker
          # driver, so Buildx needs a docker-container builder.
          driver: docker-container

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Job summary
        if: always()
        run: |
          echo "## ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ${{ steps.lint.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.app }}:latest" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A hung step otherwise burns minutes for 6 hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        id: lint
        run: |
          if ruff check .; then
            echo "Primary linter passed: ruff"
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "ruff failed, trying fallback linter"
            if pip install --quiet flake8 && flake8 --max-line-length=100 --extend-ignore=E203,W503 .; then
              echo "Fallback linter passed"
              echo "result=pass-fallback" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Both ruff and flake8 failed"
              echo "result=fail" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fail if linting failed
        if: steps.lint.outputs.result == 'fail'
        run: exit 1

      - name: Test (pytest)
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # type=gha cache export is unsupported on the default docker
          # driver, so Buildx needs a docker-container builder.
          driver: docker-container

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/backend:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/backend:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Job summary
        if: always()
        run: |
          echo "## Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ${{ steps.lint.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ vars.DOCKERHUB_USERNAME }}/backend:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ vars.DOCKERHUB_USERNAME }}/backend:latest" >> "$GITHUB_STEP_SUMMARY"
