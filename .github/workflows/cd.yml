name: CD

on:
  workflow_run:
    workflows: ["CI"] # Must match the exact name: in your ci.yml
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m 
          script: |
            cd /home/ubuntu/my-app
            echo "Fetching latest changes from main branch..."
            git pull origin main
            
            echo "Rebuilding and starting Docker Compose containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            echo "Running deployment smoke test gate..."
            chmod +x ./scripts/smoke.sh
            ./scripts/smoke.sh http://localhost
